name: Validate agent skills package

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate plugin and marketplace package
        run: python tools/validate_package.py
      - name: Test profile auditing and package checks
        run: python -m unittest discover -s tests -v
      - name: Validate Agent Skills metadata
        run: gh skill publish --dry-run .
